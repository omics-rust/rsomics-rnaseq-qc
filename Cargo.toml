[package]
name = "rsomics-rnaseq-qc"
version = "0.1.0"
description = "Coordinated mapping, annotation, coverage, and transcript-integrity QC"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-rnaseq-qc"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rsomics-bamio = "=0.8.4"
rsomics-common = "=0.12.3"
rsomics-help = "=0.4.0"
rsomics-pileup = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
noodles = { version = "0.110", features = ["bam", "bgzf", "sam"] }
tempfile = "3"
